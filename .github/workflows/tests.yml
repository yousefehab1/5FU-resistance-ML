name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
          python -m pip install -e ".[test]"

      # data/processed/ is not in git (it is rebuilt from ~14 GB of inputs), so
      # CI runs the library tests only; the golden gate skips itself and must
      # be run locally after `make run`.
      - name: Tests
        run: python -m pytest tests/ -q -rs
