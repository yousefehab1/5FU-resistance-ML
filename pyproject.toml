[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fivefu"
version = "1.0.0"
description = "Predicting 5-fluorouracil resistance from cell-line transcriptomes (GDSC1/GDSC2)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

# Lower bounds only. Exact reproduction of tests/golden/ needs requirements.lock.txt:
# the float32 ElasticNet fits shift by ~5e-7 across scikit-learn versions.
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pyarrow>=12.0",
  "openpyxl>=3.1",
  "joblib>=1.3",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "statsmodels>=0.14",
  "PyYAML>=6.0",
  "decoupler>=2.2",      # TF activity inference (scripts/21)
  "intervaltree>=3.1",   # peak-to-gene interval joins (scripts/22)
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
dashboard = ["streamlit>=1.28"]
notebooks = ["jupyter", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
